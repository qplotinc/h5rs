[package]
name = "h5rs"
version = "0.1.0"
edition = "2024"

[dependencies]
binrw = "0.15.0"
bytemuck = "1.23.2"
bytes = "1.10"
modular-bitfield = "0.12.0"
futures = "0.3.31"
flate2 = { version = "1.1.2", features = ["zlib-rs"], default-features = false }
object_store = "0.13"

[dev-dependencies]
hdf5 = { path = "../hdf5-rust/hdf5" }
ndarray = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
